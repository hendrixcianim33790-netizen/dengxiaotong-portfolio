<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>页面走丢了 · Deng Xiaotong</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23241f26'/%3E%3Cpath d='M9 10h5.2c2.6 0 4.1 1.4 4.1 3.6 0 1.5-.7 2.5-1.9 3l3 5.4h-3.1l-2.6-4.8h-1.9v4.8H9z' fill='%23f2eef0'/%3E%3Ccircle cx='23' cy='21' r='2' fill='%23d98a9a'/%3E%3C/svg%3E">
<style>
:root{--bg:#241f26;--fg:#f2eef0;--muted:rgba(242,238,240,.62);--line:rgba(255,255,255,.1)}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--fg);
  font-family:"Quicksand","Noto Sans SC",system-ui,-apple-system,"PingFang SC",sans-serif;
  display:grid;place-items:center;text-align:center;padding:24px;
  -webkit-font-smoothing:antialiased;
}
.box{max-width:460px}
.code{
  font-size:clamp(72px,18vw,132px);line-height:1;font-weight:700;
  letter-spacing:-.03em;margin:0 0 18px;
  background:linear-gradient(135deg,#f2eef0 0%,#d98a9a 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
h1{font-size:19px;font-weight:600;margin:0 0 10px}
p{color:var(--muted);font-size:14px;line-height:1.75;margin:0 0 28px}
a{
  display:inline-block;padding:11px 26px;border-radius:999px;
  border:1px solid var(--line);color:var(--fg);text-decoration:none;
  font-size:14px;font-weight:500;transition:background .25s,border-color .25s;
}
a:hover{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.24)}
a:focus-visible{outline:2px solid #d98a9a;outline-offset:3px}
</style>
</head>
<body>
  <div class="box">
    <p class="code">404</p>
    <h1>这个页面不在文件夹里</h1>
    <p>你要找的素材可能被移动过,或者链接敲错了一个字母。<br>回首页看看还剩什么。</p>
    <a href="./">回到首页</a>
  </div>
</body>
</html>
